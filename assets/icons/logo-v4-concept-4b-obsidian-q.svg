<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="QuickFlare - Obsidian Q over Cloudflare Cloud">
  <defs>
    <!-- Background Tile -->
    <linearGradient id="v4-c2-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="v4-c2-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Cloudflare Cloud Gradient -->
    <linearGradient id="v4-c2-cloud" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="80%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- Obsidian 'Q' Body Gradient -->
    <linearGradient id="v4-c2-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Specular Highlight on Obsidian Q -->
    <linearGradient id="v4-c2-specular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#94A3B8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>

    <!-- Electric Flare Tail Gradient -->
    <linearGradient id="v4-c2-tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FDE047"/>
      <stop offset="75%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Dark Tile Badge -->
  <rect width="512" height="512" rx="118" fill="url(#v4-c2-bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="116.5" fill="none" stroke="url(#v4-c2-border)" stroke-width="2"/>

  <!-- ==================== 1. SOLID CLOUDFLARE CLOUD (BACKGROUND) ==================== -->
  <path d="M 120 340 
           L 392 340 
           C 426 340, 452 314, 452 280 
           C 452 248, 428 222, 396 218 
           C 390 156, 342 108, 282 108 
           C 238 108, 200 132, 180 168 
           C 168 162, 154 158, 140 158 
           C 102 158, 72 186, 70 224 
           C 42 230, 20 256, 20 288 
           C 20 318, 44 340, 74 340 
           Z" 
        fill="url(#v4-c2-cloud)"/>

  <!-- ==================== 2. OBSIDIAN 'Q' OVER CLOUD (FOREGROUND) ==================== -->
  <g id="obsidian-q">
    <!-- Drop Shadow under Obsidian Q onto the Cloud surface -->
    <circle cx="265" cy="245" r="76" fill="none" stroke="#000000" stroke-width="48" opacity="0.4"/>
    <path d="M 300 280 L 400 380" stroke="#000000" stroke-width="48" stroke-linecap="round" opacity="0.4"/>

    <!-- Main Obsidian 'Q' Ring -->
    <circle cx="265" cy="245" r="76" 
            fill="none" stroke="url(#v4-c2-obsidian)" stroke-width="44" stroke-linecap="round"/>

    <!-- Crisp Specular Ridge along Obsidian Q -->
    <path d="M 195 245 A 76 76 0 0 1 335 210" 
          fill="none" stroke="url(#v4-c2-specular)" stroke-width="7" stroke-linecap="round"/>

    <!-- Deep Tunnel Core Void -->
    <circle cx="265" cy="245" r="54" fill="#04070E" stroke="#1E293B" stroke-width="3"/>

    <!-- Electric Flare Tail Bursting Out of the Q -->
    <path d="M 305 285 L 405 385" 
          fill="none" stroke="url(#v4-c2-tail)" stroke-width="42" stroke-linecap="round"/>

    <!-- 4-Point Solar Flare Star -->
    <g transform="translate(405, 385)">
      <path d="M 0 -34 Q 0 0 34 0 Q 0 0 0 34 Q 0 0 -34 0 Q 0 0 0 -34 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="7" fill="#FDE047"/>
    </g>
  </g>
</svg>
