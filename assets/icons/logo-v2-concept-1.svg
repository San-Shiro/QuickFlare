<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="QuickFlare - Prism Cloud Q-Beam">
  <defs>
    <!-- Background -->
    <linearGradient id="v2-c1-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="v2-c1-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Cloud Body Gradient (Cloudflare signature vibrant sunset) -->
    <linearGradient id="v2-c1-cloud" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="30%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- Tunnel Core Gradient -->
    <linearGradient id="v2-c1-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Laser Q-Beam Gradient (Crisp, hot, no glow) -->
    <linearGradient id="v2-c1-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="65%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Specular highlight streak -->
    <linearGradient id="v2-c1-specular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark Tile -->
  <rect width="512" height="512" rx="118" fill="url(#v2-c1-bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="116.5" fill="none" stroke="url(#v2-c1-border)" stroke-width="2"/>

  <!-- The Geometric Cloud Body -->
  <!-- Formed by 3 harmonic arcs and a rounded pill baseline -->
  <g>
    <!-- Base Cloud Silhouette -->
    <path d="M 160 340 
             L 300 340 
             A 65 65 0 0 0 365 275 
             A 65 65 0 0 0 340 220 
             A 90 90 0 0 0 195 195 
             A 70 70 0 0 0 125 275 
             A 65 65 0 0 0 160 340 Z" 
          fill="url(#v2-c1-cloud)"/>

    <!-- Specular Highlight Curve on Cloud Dome -->
    <path d="M 165 220 
             A 90 90 0 0 1 295 190 
             A 65 65 0 0 1 345 235" 
          fill="none" stroke="url(#v2-c1-specular)" stroke-width="8" stroke-linecap="round"/>

    <!-- Central Tunnel Portal (The 'O' inside the Cloud) -->
    <circle cx="240" cy="270" r="54" fill="url(#v2-c1-core)" stroke="#0E1322" stroke-width="8"/>
    <circle cx="240" cy="270" r="38" fill="#030508"/>

    <!-- Negative Space Cutout for Q-Beam (Ensures clean graphic separation) -->
    <path d="M 285 285 L 420 420" stroke="#0E1322" stroke-width="56" stroke-linecap="round"/>

    <!-- The Q-Beam (The kinetic reverse proxy conduit piercing out to form the Q) -->
    <path d="M 275 275 L 410 410" 
          fill="none" stroke="url(#v2-c1-beam)" stroke-width="42" stroke-linecap="round"/>

    <!-- Apex 4-Point Flare Star at the tip of the Q -->
    <g transform="translate(410, 410)">
      <path d="M 0 -30 Q 0 0 30 0 Q 0 0 0 30 Q 0 0 -30 0 Q 0 0 0 -30 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="5" fill="#FDE047"/>
    </g>
  </g>
</svg>
