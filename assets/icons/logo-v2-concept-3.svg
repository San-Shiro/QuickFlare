<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="QuickFlare - Kinetic Cloud Aperture">
  <defs>
    <!-- Background -->
    <linearGradient id="v2-c3-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="v2-c3-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Cloud Stroke Gradient -->
    <linearGradient id="v2-c3-cloud-stroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- Q Ring Gradient -->
    <linearGradient id="v2-c3-ring-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="30%" stop-color="#F97316"/>
      <stop offset="70%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Flare Conduit -->
    <linearGradient id="v2-c3-flare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Dark Tile -->
  <rect width="512" height="512" rx="118" fill="url(#v2-c3-bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="116.5" fill="none" stroke="url(#v2-c3-border)" stroke-width="2"/>

  <!-- Left Cloud Wing (The Cloudflare Cloud silhouette) -->
  <path d="M 195 340 
           L 145 340 
           A 55 55 0 0 1 105 245 
           A 75 75 0 0 1 230 180 
           A 85 85 0 0 1 315 200" 
        fill="none" stroke="url(#v2-c3-cloud-stroke)" stroke-width="44" stroke-linecap="round"/>

  <!-- Tunnel Aperture Core (Depressed background circle) -->
  <circle cx="285" cy="275" r="75" fill="#04060A" stroke="#1E293B" stroke-width="3"/>
  <circle cx="285" cy="275" r="62" fill="#020306"/>

  <!-- Primary 'Q' Portal Ring (Interlocking with the Cloud) -->
  <circle cx="285" cy="275" r="75" 
          fill="none" stroke="url(#v2-c3-ring-stroke)" stroke-width="44" stroke-linecap="round"/>

  <!-- Negative Space Knockout for the Q Tail -->
  <path d="M 330 320 L 415 405" stroke="#0E1322" stroke-width="56" stroke-linecap="round"/>

  <!-- Kinetic Flare Arrow forming the 'Q' Tail -->
  <path d="M 320 310 L 410 400" 
        fill="none" stroke="url(#v2-c3-flare)" stroke-width="44" stroke-linecap="round"/>

  <!-- 4-Point Flare Spark at tip -->
  <g transform="translate(410, 400)">
    <path d="M 0 -32 Q 0 0 32 0 Q 0 0 0 32 Q 0 0 -32 0 Q 0 0 0 -32 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="6" fill="#FDE047"/>
  </g>
</svg>
