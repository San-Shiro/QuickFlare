<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="QuickFlare - Large Standalone 3D Spline Q over Complex Cloud">
  <defs>
    <!-- Complex Cloudflare Cloud: Back Layer -->
    <linearGradient id="v6-6b-cloud-back" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Complex Cloudflare Cloud: Front Layer -->
    <linearGradient id="v6-6b-cloud-front" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- Cloud Specular -->
    <linearGradient id="v6-6b-cloud-spec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Pure White-Gold 3D Q Ribbon -->
    <linearGradient id="v6-6b-q-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFFBEB"/>
      <stop offset="70%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
  </defs>

  <!-- ==================== 1. COMPLEX MULTI-LAYER CLOUD (BACKGROUND) ==================== -->
  <g id="standalone-complex-cloud">
    <!-- Back Cloud Body -->
    <path d="M 140 315 
             L 375 315 
             C 402 315, 424 295, 424 268 
             C 424 243, 405 222, 380 218 
             C 375 168, 335 128, 284 128 
             C 246 128, 212 148, 196 178 
             C 185 173, 173 170, 160 170 
             C 128 170, 102 195, 100 226 
             C 76 232, 58 253, 58 280 
             C 58 304, 78 315, 102 315 
             Z" 
          fill="url(#v6-6b-cloud-back)"/>

    <!-- Front Cloud Sunset Overlap -->
    <path d="M 235 315 
             L 380 315 
             C 404 315, 424 296, 424 272 
             C 424 250, 408 232, 386 228 
             C 380 196, 355 172, 325 172 
             C 305 172, 288 182, 276 198 
             C 268 194, 258 192, 248 192 
             C 224 192, 204 210, 202 234 
             C 185 240, 172 256, 172 276 
             C 172 298, 190 315, 212 315 
             Z" 
          fill="url(#v6-6b-cloud-front)" 
          stroke="#7C2D12" stroke-width="2.5"/>

    <!-- Specular Arc on Dome -->
    <path d="M 210 175 C 230 144, 260 135, 284 135 C 324 135, 360 162, 372 205" 
          fill="none" stroke="url(#v6-6b-cloud-spec)" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- ==================== 2. LARGE DOMINANT 3D SPLINE 'Q' (FOREGROUND) ==================== -->
  <g id="standalone-large-q">
    <!-- Ambient Occlusion Shadow onto Cloud (Crisp vector shadow) -->
    <circle cx="252" cy="254" r="100" fill="none" stroke="#7C2D12" stroke-width="50" opacity="0.45"/>
    <path d="M 292 294 L 362 364" stroke="#7C2D12" stroke-width="50" stroke-linecap="round" opacity="0.45"/>

    <!-- Tunnel Core Hole -->
    <circle cx="252" cy="250" r="76" fill="#0E1322" stroke="#1E293B" stroke-width="3"/>
    <circle cx="252" cy="250" r="62" fill="#04060C"/>

    <!-- Main Large 'Q' Ring (Dominant, framing the cloud) -->
    <circle cx="252" cy="250" r="100" 
            fill="none" stroke="url(#v6-6b-q-ribbon)" stroke-width="44" stroke-linecap="round"/>

    <!-- Specular Ridge on Upper Rim -->
    <path d="M 160 250 A 100 100 0 0 1 345 200" 
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.95"/>

    <!-- Compact Flare Stick / Tail (Smaller, NO STAR, Clean rounded cap) -->
    <path d="M 292 290 L 362 360" 
          fill="none" stroke="url(#v6-6b-q-ribbon)" stroke-width="44" stroke-linecap="round"/>

    <!-- Inner Highlight on Stick -->
    <path d="M 296 288 L 356 348" 
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
