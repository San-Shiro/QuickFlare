<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="QuickFlare - Large Q with Angled Stick Cut">
  <defs>
    <!-- Background Tile -->
    <linearGradient id="v6-6d-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="v6-6d-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Cloud Back -->
    <linearGradient id="v6-6d-cloud-back" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Cloud Front -->
    <linearGradient id="v6-6d-cloud-front" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <linearGradient id="v6-6d-cloud-spec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Obsidian Q Body -->
    <linearGradient id="v6-6d-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="v6-6d-specular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#94A3B8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>

    <!-- Electric Amber Flare Tail Gradient -->
    <linearGradient id="v6-6d-tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FDE047"/>
      <stop offset="75%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Dark Tile Badge -->
  <rect width="512" height="512" rx="118" fill="url(#v6-6d-bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="116.5" fill="none" stroke="url(#v6-6d-border)" stroke-width="2"/>

  <!-- Complex Cloudflare Cloud (Background) -->
  <g id="cloud-backdrop-6d">
    <path d="M 140 315 L 375 315 C 402 315, 424 295, 424 268 C 424 243, 405 222, 380 218 C 375 168, 335 128, 284 128 C 246 128, 212 148, 196 178 C 185 173, 173 170, 160 170 C 128 170, 102 195, 100 226 C 76 232, 58 253, 58 280 C 58 304, 78 315, 102 315 Z" fill="url(#v6-6d-cloud-back)"/>
    <path d="M 235 315 L 380 315 C 404 315, 424 296, 424 272 C 424 250, 408 232, 386 228 C 380 196, 355 172, 325 172 C 305 172, 288 182, 276 198 C 268 194, 258 192, 248 192 C 224 192, 204 210, 202 234 C 185 240, 172 256, 172 276 C 172 298, 190 315, 212 315 Z" fill="url(#v6-6d-cloud-front)" stroke="#0E1322" stroke-width="3"/>
    <path d="M 210 175 C 230 144, 260 135, 284 135 C 324 135, 360 162, 372 205" fill="none" stroke="url(#v6-6d-cloud-spec)" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- Large Dominant 'Q' with Architectural Angled Stick Cut -->
  <g id="large-cut-q">
    <circle cx="252" cy="254" r="100" fill="none" stroke="#000000" stroke-width="48" opacity="0.45"/>
    <path d="M 292 294 L 366 368" stroke="#000000" stroke-width="48" stroke-linecap="square" opacity="0.45"/>

    <circle cx="252" cy="250" r="76" fill="#04060C" stroke="#1E293B" stroke-width="2.5"/>

    <circle cx="252" cy="250" r="100" 
            fill="none" stroke="url(#v6-6d-obsidian)" stroke-width="44" stroke-linecap="round"/>

    <path d="M 160 250 A 100 100 0 0 1 345 200" 
          fill="none" stroke="url(#v6-6d-specular)" stroke-width="8" stroke-linecap="round"/>

    <!-- Stick with Architectural Flush 45° Angle Cut (No Star!) -->
    <!-- Drawn as a polygon for razor-sharp geometric termination -->
    <path d="M 276 306 
             L 306 276 
             L 376 346 
             L 346 376 Z" 
          fill="url(#v6-6d-tail)"/>

    <path d="M 306 276 L 376 346" 
          stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>
  </g>
</svg>
