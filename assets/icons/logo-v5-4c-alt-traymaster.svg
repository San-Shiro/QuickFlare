<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="QuickFlare - Standalone Cloud with Obsidian Q">
  <defs>
    <!-- Cloudflare Cloud Gradient -->
    <linearGradient id="v5-4calt-cloud" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- Cloud Specular Highlight -->
    <linearGradient id="v5-4calt-cloud-spec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Obsidian 'Q' Body Gradient -->
    <linearGradient id="v5-4calt-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="v5-4calt-specular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#94A3B8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>

    <!-- Electric Flare Tail Gradient -->
    <linearGradient id="v5-4calt-tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- ==================== 1. OPTICALLY CENTERED CLOUDFLARE CLOUD ==================== -->
  <path d="M 138 365 
           L 410 365 
           C 442 365, 466 341, 466 309 
           C 466 279, 444 253, 414 249 
           C 408 191, 362 145, 304 145 
           C 260 145, 222 169, 202 203 
           C 190 197, 176 193, 162 193 
           C 126 193, 96 221, 94 257 
           C 66 263, 46 287, 46 319 
           C 46 347, 68 365, 96 365 
           Z" 
        fill="url(#v5-4calt-cloud)"/>

  <!-- Cloud Top Specular Sheen -->
  <path d="M 218 198 C 242 164, 276 153, 304 153 C 350 153, 390 185, 404 232" 
        fill="none" stroke="url(#v5-4calt-cloud-spec)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- ==================== 2. PROPORTIONALLY BALANCED OBSIDIAN 'Q' ==================== -->
  <g id="standalone-obsidian-q">
    <!-- Ambient Occlusion Shadow onto Cloud (Crisp vector shadow) -->
    <circle cx="246" cy="262" r="56" fill="none" stroke="#7C2D12" stroke-width="40" opacity="0.45"/>
    <path d="M 275 291 L 370 386" stroke="#7C2D12" stroke-width="40" stroke-linecap="round" opacity="0.45"/>

    <!-- Main Obsidian 'Q' Ring -->
    <circle cx="246" cy="258" r="56" 
            fill="none" stroke="url(#v5-4calt-obsidian)" stroke-width="34" stroke-linecap="round"/>

    <!-- Specular Highlight Ridge on Obsidian Ring -->
    <path d="M 195 258 A 56 56 0 0 1 300 230" 
          fill="none" stroke="url(#v5-4calt-specular)" stroke-width="6" stroke-linecap="round"/>

    <!-- Central Tunnel Core Hole -->
    <circle cx="246" cy="258" r="39" fill="#0E1322" stroke="#1E293B" stroke-width="2.5"/>

    <!-- Electric Flare Tail Slicing past the Cloud Baseline to (370, 382) -->
    <path d="M 275 287 L 370 382" 
          fill="none" stroke="url(#v5-4calt-tail)" stroke-width="34" stroke-linecap="round"/>

    <!-- 4-Point Solar Flare Star -->
    <g transform="translate(370, 382)">
      <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="5.5" fill="#FDE047"/>
    </g>
  </g>
</svg>
