<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="QuickFlare - Large Obsidian Q over Complex Cloud">
  <defs>
    <!-- Background Tile -->
    <linearGradient id="v6-6a-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="v6-6a-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Complex Cloudflare Cloud: Back Layer (Deep Orange) -->
    <linearGradient id="v6-6a-cloud-back" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Complex Cloudflare Cloud: Front Layer (Vibrant Amber/Gold) -->
    <linearGradient id="v6-6a-cloud-front" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- Cloud Specular Ridge -->
    <linearGradient id="v6-6a-cloud-spec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Large Obsidian 'Q' Body Gradient -->
    <linearGradient id="v6-6a-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>

    <!-- Specular Highlight on Obsidian Q -->
    <linearGradient id="v6-6a-specular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#94A3B8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>

    <!-- Electric Amber Flare Tail Gradient -->
    <linearGradient id="v6-6a-tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FDE047"/>
      <stop offset="75%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Dark Tile Badge -->
  <rect width="512" height="512" rx="118" fill="url(#v6-6a-bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="116.5" fill="none" stroke="url(#v6-6a-border)" stroke-width="2"/>

  <!-- ==================== 1. COMPLEX MULTI-LAYER CLOUDFLARE CLOUD (BACKGROUND) ==================== -->
  <g id="complex-cloud">
    <!-- Back Cloud Body -->
    <path d="M 140 315 
             L 375 315 
             C 402 315, 424 295, 424 268 
             C 424 243, 405 222, 380 218 
             C 375 168, 335 128, 284 128 
             C 246 128, 212 148, 196 178 
             C 185 173, 173 170, 160 170 
             C 128 170, 102 195, 100 226 
             C 76 232, 58 253, 58 280 
             C 58 304, 78 315, 102 315 
             Z" 
          fill="url(#v6-6a-cloud-back)"/>

    <!-- Front Cloud Sunset Overlap (Authentic Cloudflare 2-tone depth) -->
    <path d="M 235 315 
             L 380 315 
             C 404 315, 424 296, 424 272 
             C 424 250, 408 232, 386 228 
             C 380 196, 355 172, 325 172 
             C 305 172, 288 182, 276 198 
             C 268 194, 258 192, 248 192 
             C 224 192, 204 210, 202 234 
             C 185 240, 172 256, 172 276 
             C 172 298, 190 315, 212 315 
             Z" 
          fill="url(#v6-6a-cloud-front)" 
          stroke="#0E1322" stroke-width="3"/>

    <!-- Crisp Top Dome Specular Arc -->
    <path d="M 210 175 C 230 144, 260 135, 284 135 C 324 135, 360 162, 372 205" 
          fill="none" stroke="url(#v6-6a-cloud-spec)" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- ==================== 2. LARGE DOMINANT 'Q' OVER CLOUD (FOREGROUND) ==================== -->
  <!-- Center: (252, 250), Centerline R: 100px, Stroke: 44px (Larger than Cloud!) -->
  <g id="large-dominant-q">
    <!-- Clean Vector Drop Shadow on Cloud (No blur) -->
    <circle cx="252" cy="254" r="100" fill="none" stroke="#000000" stroke-width="48" opacity="0.45"/>
    <!-- Shadow for Stick -->
    <path d="M 292 294 L 362 364" stroke="#000000" stroke-width="48" stroke-linecap="round" opacity="0.45"/>

    <!-- Tunnel Core Void (Center Depth) -->
    <circle cx="252" cy="250" r="76" fill="#04060C" stroke="#1E293B" stroke-width="2.5"/>

    <!-- Main Large Obsidian 'Q' Ring -->
    <circle cx="252" cy="250" r="100" 
            fill="none" stroke="url(#v6-6a-obsidian)" stroke-width="44" stroke-linecap="round"/>

    <!-- Specular Highlight Ridge on Upper Obsidian Ring -->
    <path d="M 160 250 A 100 100 0 0 1 345 200" 
          fill="none" stroke="url(#v6-6a-specular)" stroke-width="8" stroke-linecap="round"/>

    <!-- Compact Flare Stick / Tail (Smaller, NO STAR, Clean rounded cap) -->
    <path d="M 292 290 L 362 360" 
          fill="none" stroke="url(#v6-6a-tail)" stroke-width="44" stroke-linecap="round"/>

    <!-- Inner Specular Edge on Tail -->
    <path d="M 296 288 L 356 348" 
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
