# Debian and RPM packaging for the QuickFlare CLI.
#
# nfpm is used rather than dpkg-buildpackage and rpmbuild because it builds
# both formats from this one file, on any machine, with no distro toolchain -
# which matters when the build host is Windows.
#
# This is a template, not a working config: packaging/build-linux.sh
# substitutes ${ARCH} and ${VERSION} and feeds nfpm the result. nfpm does not
# expand environment variables inside content globs, so a templated source
# path there silently matches nothing rather than failing loudly.
name: quickflare
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: QuickFlare contributors <noreply@users.noreply.github.com>
vendor: QuickFlare
homepage: https://github.com/San-Shiro/QuickFlare
license: Apache-2.0

description: |
  Publish a localhost port to the internet through Cloudflare Tunnel.
  QuickFlare creates the tunnel, writes the DNS record and adds the ingress
  rule, so a local service gets a public hostname on a domain you own without
  port forwarding or firewall changes.
  .
  This package provides the command line interface. The tray application is
  Windows-only.
  .
  Routes are public: QuickFlare publishes a hostname and adds no
  authentication of its own.

# Recommends rather than Depends. cloudflared is not in the Debian or Fedora
# archives - it comes from Cloudflare's own repository - so a hard dependency
# would make this package uninstallable on a stock system.
recommends:
  - cloudflared

contents:
  - src: ./build/linux/${ARCH}/quickflare
    dst: /usr/bin/quickflare
    file_info:
      mode: 0755

  - src: ./LICENSE
    dst: /usr/share/doc/quickflare/LICENSE
    file_info:
      mode: 0644

  - src: ./README.md
    dst: /usr/share/doc/quickflare/README.md
    file_info:
      mode: 0644

  - src: ./CHANGELOG.md
    dst: /usr/share/doc/quickflare/CHANGELOG.md
    file_info:
      mode: 0644
